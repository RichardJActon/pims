<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Required meta tags -->
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- Bootstrap CSS (flatly from bootswatch)-->
		<link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

		<!-- CSS -->
		<link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
		{% block css %} {% endblock %}

		<title>{% block title %}PIMS Proteomics LIMS{% endblock %}</title>
	</head>
	<body>
		<div id="maincontent" class="container">
			<div class="row">
				<div class="col-md-2">
					<div class="d-grid gap-2  pb-2">
						<img src="{{ url_for('static', filename='images/pims_logo_path_notext.svg') }}" width=60% style="margin-left: auto; margin-right: auto;">
					</div>
					<div class="d-grid gap-2">
						{% block buttons %} {% endblock %}
					</div>
				</div>
				<div class="col-md-10">
					<div class="row text-center">
						<h2>PIMS Proteomics LIMS System</h2>
					</div>
					{% block content %}{% endblock %}
				</div>
			</div>
			<div id="footer" class="row fixed-bottom">
				<div class="col-md-12">
					<img src="{{ url_for('static', filename='images/bioinformatics_logo.svg') }}" width="100px">
					<!-- paramaterise the issue tracker url? -->
					<a href="https://github.com/s-andrews/pims">PIMS Proteomics LIMS</a>
					- Please report any problems to our <a href="https://github.com/s-andrews/pims/issues">bug database</a>
				</div>
			</div>
		</div>

		<!-- Bootstrap JS -->
		<script src="{{ url_for('static', filename='node_modules/bootstrap/dist/bootstrap.min.js') }}"></script>

		<!-- JQuery which we're still using even if bootstrap doesn't need it any more -->
		<!-- integrity? -->
		<script src="{{ url_for('static', filename='node_modules/jquery/dist/jquery.min.js') }}"></script>

		<!-- JSCookie -->
		<script src="{{ url_for('static', filename='node_modules/js-cookies/dist/js.cookie.min.js') }}"></script>

		<!-- Custom JS -->
		<script src="{{ url_for('static', filename='js/main.js') }}"></script>
		{% block js %}{% endblock %}
	</body>
</html>
