name: Test and Document

on:
  push:
    branches:
      - main
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python-version: ["3.11.15"]
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.11.32"

      - name: install ldap
        run: |
          sudo apt-get update
          sudo apt-get install -y slapd ldap-utils libsasl2-dev libldap2-dev libssl-dev
        
      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        # For example, using `pytest`
        run: |
          PIMS_CONFIG_PATH=/home/runner/work/pims/configuration/conf.json
          uv run pytest --ignore=data --ignore=database --doctest-modules
        
  document:
    name: document
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.11.32"
          
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y slapd ldap-utils libsasl2-dev libldap2-dev libssl-dev make

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: build docs
        id: build
        run: |
          cd docs
          uv run make html
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: docs/build/html/

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: [document, test] 
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
